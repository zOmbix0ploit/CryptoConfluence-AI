name: Deploy CryptoConfluence AI to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Configure Next.js for static GitHub Pages export
        run: |
          rm -rf app/api
          rm -rf app/signals/\[id\]
          cat << 'EOF' > next.config.ts
          import type { NextConfig } from "next";
          const nextConfig: NextConfig = {
            output: "export",
            basePath: "/CryptoConfluence-AI",
            assetPrefix: "/CryptoConfluence-AI/",
            images: { unoptimized: true },
            eslint: { ignoreDuringBuilds: true },
            typescript: { ignoreBuildErrors: true },
          };
          export default nextConfig;
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
