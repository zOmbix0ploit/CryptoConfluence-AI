name: Run Python AI Signal & News Engine (24/7 Live Sync)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "python-engine"
  cancel-in-progress: false

jobs:
  run-python-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ./backend/requirements.txt

      - name: Install Python Backend Dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Execute Python Signal, News & PnL Engine
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PNL_WEBHOOK_URL: ${{ secrets.DISCORD_PNL_WEBHOOK_URL }}
          NOTIFY_DISCORD: ${{ secrets.NOTIFY_DISCORD }}
          NOTIFY_DISCORD_PNL: ${{ secrets.NOTIFY_DISCORD_PNL }}
        run: python run_github_scan.py

      - name: Commit and Push Live Python Data Snapshot
        run: |
          git config user.name "CryptoConfluence AI Bot"
          git config user.email "bot@cryptoconfluence.ai"
          git add frontend/public/static-data/*.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(engine): live Python signal, news & PnL update [skip ci]"
            git push origin HEAD:main
          else
            echo "No changes in static-data snapshots."
          fi
